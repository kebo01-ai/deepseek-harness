# Experimental cc-session board Web layer. Apply after dsh-web-app and the
# host-side dsh-experimental-cc-sessions-profile so the browser mounts only when
# the directory's Remote face is present.
#
# The row adds one global panel: a sidebar entry and the full-page board behind
# it. It occupies a seat the shipped composition leaves empty, so no shipped
# panel is replaced.
- insert:
    - id: ui-cc-board
      name: '@deepseek-ai/dsh-experimental-client-ui-cc-board'
